name: Build audio_hook.dll

permissions:
  contents: write

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (MSVC x64)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          cd src
          if not exist hook_obj mkdir hook_obj
          cl -nologo -utf-8 -LD -MT -O2 -W3 -Iasiosdk -Fe:audio_hook.dll -Fo:hook_obj\ audio_hook.cpp -link -MACHINE:X64 user32.lib
          if errorlevel 1 exit /b 1
          cl -nologo -utf-8 -MT -O2 -W3 -Iasiosdk -Fe:asio_list.exe asio_list.cpp -link ole32.lib advapi32.lib user32.lib
          if errorlevel 1 exit /b 1
          cl -nologo -utf-8 -MT -O2 -W3 -Fe:excl_rate_probe.exe excl_rate_probe.cpp -link ole32.lib uuid.lib
          if errorlevel 1 exit /b 1
          cl -nologo -utf-8 -MT -O2 -W3 -Fe:session_tool.exe session_tool.cpp -link ole32.lib uuid.lib psapi.lib
          if errorlevel 1 exit /b 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: audio_hook
          path: |
            src/audio_hook.dll
            src/asio_list.exe
            src/excl_rate_probe.exe
            src/session_tool.exe

      - name: Extract release notes for this tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # Release notes are curated in CHANGELOG.md, not auto-generated from commits.
          # Take the section for this tag ("## [<tag>]") up to the next "## [" heading.
          $tag = $env:GITHUB_REF -replace '^refs/tags/v', ''
          $lines = Get-Content CHANGELOG.md
          $hit = $lines | Select-String -Pattern "^## \[$([regex]::Escape($tag))\]" | Select-Object -First 1
          if (-not $hit) {
            "No CHANGELOG.md section found for v$tag." | Set-Content RELEASE_NOTES.md
            Add-Content RELEASE_NOTES.md "See [CHANGELOG.md](CHANGELOG.md) for the full history."
            Write-Host "no section for v$tag - wrote a pointer instead"
            exit 0
          }
          $start = $hit.LineNumber
          $end = $lines.Count
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^## \[') { $end = $i; break }
          }
          $lines[($start - 1)..($end - 1)] -join "`n" | Set-Content RELEASE_NOTES.md -Encoding utf8
          Write-Host "extracted CHANGELOG.md lines $start..$end for v$tag"

      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/audio_hook.dll
            src/asio_list.exe
            src/excl_rate_probe.exe
            src/session_tool.exe
          body_path: RELEASE_NOTES.md
